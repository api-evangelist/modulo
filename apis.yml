name: Modulo
description: 'Modulo Bio is a San Diego, California biotechnology company reprogramming the neuroimmune
  system to overcome the world''s toughest neurological diseases. The company develops therapeutics that
  target microglia, the brain''s resident immune cells, by combining stem cell engineering, neurobiology,
  multiomics (CRISPR and single-cell techniques), and machine learning to understand and manipulate
  microglial behavior, identify biomarkers, and discover new drug candidates. Modulo Bio is a therapeutics
  research company and does not currently publish a public developer platform, API, or technical
  documentation; this profile captures its identity and domain-security posture.'
